# CUV.yaml — config for Chinese Union Version (Traditional)
#
# Invoke any tool with:  --config CUV

alignments_root: ./data/alignments

# ---------------------------------------------------------------------------
# Identity
# ---------------------------------------------------------------------------

target_language: zht
biblica_language: cmn
target_edition: CUV
target_edition_name: Chinese Union Version (Traditional)

# for migrating alignments from a reference edition (e.g. for diff-migrate or sim-migrate)
source_edition: LEB
source_language: eng

alignment_sources: []
alignment_suffix: LLM-REFINED
from-scratch: true

# smaller chunks?
batch-size: 4
max_output_tokens: 32000

# Gloo
llm_provider: gloo
reasoning_effort: low
#llm_model: gloo-deepseek-v4-pro
llm_model: gloo-google-gemini-3.7-flash # cheap through Dec 31 2026, then doubles

# Ollama (local)
#llm_provider: ollama
#llm_model: qwen3.6:35b

# ---------------------------------------------------------------------------
# retry-alignment settings
# ---------------------------------------------------------------------------

fallback_threshold: 1.1  # >1.0 so it can never trigger (flagged ratio maxes at 1.0) — 62002's 93% flagged rate would otherwise force the cheap refine model instead of the Gemini retry model

# LLM provider and model for retry-alignment (the second-pass / quality-repair step).
# If absent, retry-alignment falls back to the llm_provider / llm_model /
# reasoning_effort values above. Set these to use a different (typically better)
# model for the retry pass than the initial refine pass.
retry_llm_provider: google
retry_llm_model: gemini-3.1-pro-preview
retry_max_output_tokens: 32000
# Alignment quality scoring threshold for retry-alignment and score-alignment.
# Verses with a composite penalty score above this value are flagged for retry.
# Range 0–1; lower = more retries, higher = fewer. Default: 0.25.
# semantic_threshold: 0.35

# retry suspect verses?
include_suspect: false
suspect_cost_per_verse_max: .05
suspect_cost_max: 5

# Legacy coverage threshold (deprecated; superseded by score_retry_threshold).
# Flag verses with more than this many unaligned source tokens.
min_unaligned_src: 2


# ---------------------------------------------------------------------------
# ACAI and trabina — paths normally derived automatically from git-root sibling
# layout, but that convention doesn't hold on this machine (text-align isn't
# nested two directories below a shared git root), so acai_data_dir is set
# explicitly to a local clone placed inside this repo (gitignored).
# ---------------------------------------------------------------------------

acai_data_dir: ./BibleAquifer/ACAI

# Local fhl_isa checkout — bakes Greek/Hebrew morphology into the click-popup
# at render time instead of the popup calling bible.fhl.net live.
# fhl_isa's better-sqlite3 native binding requires Node >=22 (this machine's
# default `node` on PATH is v19.9.0, incompatible — see nvm use 22), so pin
# fhl_node_bin to the nvm-installed v22 binary explicitly.
fhl_parsing_dir: ./fhl_isa
fhl_node_bin: /home/paulhjwu/.nvm/versions/node/v22.22.2/bin/node

# ---------------------------------------------------------------------------
# sim-migrate settings
# ---------------------------------------------------------------------------

model: sentence-transformers/LaBSE
min_similarity: 0.7
max_word_distance: 8
